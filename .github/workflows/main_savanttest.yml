# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - savanttest

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://mcr.microsoft.com/
        username: ${{ secrets.AzureAppService_ContainerUsername_6a4cbd5cf66d4dd8a34ec0da56536c7a }}
        password: ${{ secrets.AzureAppService_ContainerPassword_fb93ded746d84bd892739773e7f8ac4e }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: mcr.microsoft.com/${{ secrets.AzureAppService_ContainerUsername_6a4cbd5cf66d4dd8a34ec0da56536c7a }}/appsvc/staticsite:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'savanttest'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_71a824b0c18f47d78910502f7e44f857 }}
        images: 'mcr.microsoft.com/${{ secrets.AzureAppService_ContainerUsername_6a4cbd5cf66d4dd8a34ec0da56536c7a }}/appsvc/staticsite:${{ github.sha }}'